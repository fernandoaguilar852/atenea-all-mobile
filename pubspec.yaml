name: atenea_all_mobile
description: ATENEA POS - Aplicación móvil multiplataforma para gestión de punto de venta
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # HTTP & API
  dio: ^5.6.0
  retrofit: ^4.1.0
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI Components
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  flutter_svg: ^2.0.10+1

  # Forms & Validation
  flutter_form_builder: ^9.3.0
  form_builder_validators: ^10.0.1

  # Printing (pendiente de agregar cuando sea necesario)
  # pdf: ^3.11.0
  # printing: ^5.13.1
  # esc_pos_printer: ^4.1.0
  # esc_pos_utils: ^1.1.0

  # Barcode Scanner
  mobile_scanner: ^5.1.1

  # Permissions
  permission_handler: ^11.3.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  logger: ^2.4.0
  jwt_decode: ^0.3.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.2
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  freezed: ^2.5.7

  # Linting
  flutter_lints: ^5.0.0
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

